<!doctype html><meta charset=utf-8><title>Home</title><link rel="icon" href="icon.svg">
<style>
html,body{height:100%}
body{margin:0;color:#fff;font:14px system-ui,sans-serif;
background:center/cover no-repeat fixed #14161a}
#g{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:14px 14px;
justify-content:start;align-content:start;padding:33px 25px}
a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#fff;cursor:pointer}
.i{width:69px;height:69px;border-radius:18px;background:rgba(255,255,255,.16);
backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
font-size:26px;font-weight:600;box-shadow:0 4px 14px #0006;transition:transform .1s}
a:hover .i{transform:scale(1.08)}
.i img{width:54px;height:54px}
span{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px #000b}
.drag{opacity:.35}
body.e .i{animation:w .4s infinite alternate}
@keyframes w{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
#clk{position:fixed;top:40px;right:20px;font-size:84px;font-weight:300;text-shadow:0 2px 10px #0008}
#b{position:fixed;top:14px;right:18px;display:flex;gap:8px}
#b button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.10);color:#fff;
border-radius:9px;cursor:pointer;font-size:18px;line-height:1;opacity:.7;
backdrop-filter:blur(6px);transition:opacity .15s}
#b button:hover{opacity:1}
</style>
<div id=b><button id=add title=add>+</button><button id=ed title=edit>&#9998;</button></div>
<div id=clk></div>
<div id=g></div>
<script src="newtab.js"></script>
