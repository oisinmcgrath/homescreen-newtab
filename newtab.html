<!doctype html><meta charset=utf-8><title>Home</title><link rel="icon" href="icon.svg">
<style>
html,body{height:100%}
body{margin:0;color:#fff;font:14px system-ui,sans-serif;
background:center/cover no-repeat fixed #14161a}
#g{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:14px 14px;
justify-content:start;align-content:start;padding:120px 25px 25px 60px;max-width:calc(100vw - 260px)}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
text-decoration:none;color:#fff;cursor:pointer}
.i{width:69px;height:69px;border-radius:18px;background:rgba(255,255,255,.16);
backdrop-filter:blur(14px) saturate(140%);display:flex;align-items:center;justify-content:center;
font-size:26px;font-weight:600;box-shadow:0 2px 10px #0004,0 0 0 1px #ffffff40 inset,0 0 0 1px #00000030;transition:transform .1s;overflow:hidden}
.tile:hover .i{transform:scale(1.08)}
.i img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 1px 3px #0007) drop-shadow(0 0 1px #0006)}
.i.fold{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;box-sizing:border-box;
background:rgba(255,255,255,.22)}
.i.fold img{width:100%;height:100%;object-fit:contain}
#g span{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap;text-shadow:0 1px 6px #000f,0 0 3px #000d,0 0 1px #000c}
.del{display:none;position:absolute;top:-6px;left:-2px;width:22px;height:22px;
background:#ff3b30;color:#fff;border-radius:50%;font:16px/22px system-ui;font-weight:700;
text-align:center;box-shadow:0 1px 4px #0007;z-index:2}
body.e .del{display:block}
.drag{opacity:.35}
body.e .i{animation:w .4s infinite alternate}
@keyframes w{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
#clk{position:fixed;top:8px;right:22px;font-size:84px;font-weight:300;text-shadow:0 2px 12px #000d,0 0 4px #000b,0 0 2px #000a}
#dt{position:fixed;top:100px;right:24px;font-size:20px;font-weight:500;text-shadow:0 1px 8px #000e,0 0 3px #000c,0 0 1px #000b}
#tl{position:fixed;top:2px;left:6px;z-index:4;display:flex;flex-direction:column;gap:12px;max-width:none;
text-shadow:0 1px 8px #000e,0 0 3px #000c}
#sol{position:fixed;top:26px;left:0;width:calc(50% - min(280px,23vw));z-index:4;overflow:visible;
display:flex;align-items:center;justify-content:center;white-space:nowrap}
#sol:empty{display:none}
#sol{font-weight:500;text-shadow:0 1px 8px #000e,0 0 3px #000c,0 0 1px #000b}
#sol>*{position:relative}

.solbox{display:inline-flex;flex:0 0 auto;width:max-content;min-width:max-content;align-items:center;gap:11px;white-space:nowrap;padding:8px 16px;border-radius:16px;
background:rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(150%);
-webkit-backdrop-filter:blur(18px) saturate(150%);
box-shadow:0 1px 4px #00000018,0 0 0 1px #ffffff26 inset;
text-shadow:0 1px 8px #000e,0 0 3px #000c}
#sol .scol{display:flex;flex-direction:column;line-height:1.15}
#sol .sl{font-size:17px;opacity:.95;white-space:nowrap;overflow:visible}
#sol .sc{font-size:14px;opacity:.82;white-space:nowrap}
#bat{display:flex;align-items:center;gap:8px;filter:drop-shadow(0 1px 3px #000c) drop-shadow(0 0 1px #000a)}
#bat .bl{font-size:13px;opacity:.88}
#sb,#cb{--tint:#8b93a1;position:fixed;left:50%;transform:translateX(-50%);z-index:4;
display:flex;align-items:center;gap:10px;width:min(560px,46vw);
background:color-mix(in srgb,var(--tint) 6%,#ffffffee);border-radius:26px;padding:11px 18px;
box-shadow:0 3px 14px #0004,0 0 0 1px color-mix(in srgb,var(--tint) 25%,transparent) inset;
backdrop-filter:blur(8px)}
#sb{top:26px}
#cb{--tint:#9b8b74;bottom:48px}
#sb #ddg,#cb #cim{width:22px;height:22px;flex:none;cursor:pointer}
#cb #cim{border-radius:5px}
#sb input,#cb input{flex:1;border:0;outline:none;background:transparent;font:16px system-ui;color:#1b1f24;caret-color:var(--tint)}
#sb input::placeholder,#cb input::placeholder{color:#8b93a1}
#wx{position:fixed;top:168px;right:48px;display:flex;flex-direction:column;
align-items:flex-end;gap:6px;font-weight:500;text-shadow:0 1px 8px #000e,0 0 3px #000c,0 0 1px #000b}
#wx .wnow{display:flex;align-items:center;gap:8px}
#wx .wcol{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
#wx .wt{font-size:32px;font-weight:300}
#wx .wd{font-size:15px;opacity:1;font-weight:500}
#wx .wr{font-size:14px;opacity:1;font-weight:500}
#wx .wf{display:flex;gap:14px;margin-top:2px}
#wx .wfi{display:flex;flex-direction:column;align-items:center;gap:1px}
#wx .wh{font-size:13px;opacity:.95;font-weight:500}
#wx .wtm{font-size:15px;font-weight:600}
#wx .wpp{font-size:13px;opacity:1;font-weight:500;color:#bcdcff;display:flex;align-items:center;gap:3px}
#wx .wset{font-size:14px;opacity:.85;cursor:pointer;border:1px solid #ffffff40;
padding:7px 12px;border-radius:9px;backdrop-filter:blur(6px);background:#0000004d}
#b{position:fixed;bottom:16px;right:16px;display:flex;gap:10px;z-index:3}
#back{position:fixed;top:14px;left:18px;z-index:3;align-items:center;justify-content:center}
#b button,#back{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#fff;
border-radius:50%;cursor:pointer;font-size:18px;line-height:1;opacity:.7;
backdrop-filter:blur(6px);transition:opacity .15s}
#b button:hover,#back:hover{opacity:1}
#b button#add{background:#1a86f0;border-color:#1a86f088;opacity:.9}
#wp{display:none;position:fixed;bottom:16px;left:16px;z-index:5;gap:8px;
background:rgba(0,0,0,.42);border:1px solid #ffffff1f;border-radius:12px;padding:8px;
backdrop-filter:blur(8px)}
body.e #wp{display:flex}
#wp div{padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;
background:#ffffff14;white-space:nowrap;user-select:none}
#wp div:hover{background:#ffffff26}
#wp div.on{background:#1a86f0cc}
#mp{display:none;position:fixed;bottom:66px;right:16px;z-index:4;min-width:180px;
background:#23262c;border-radius:10px;padding:6px;box-shadow:0 8px 24px #000a}
#mp.open{display:block}
#mp div{padding:9px 12px;border-radius:7px;font-size:14px;cursor:pointer}
#mp div:hover{background:#ffffff18}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;
justify-content:center;z-index:10}
.dlg{background:#23262c;padding:22px 24px;border-radius:14px;min-width:280px;
box-shadow:0 8px 30px #000a}
.dlg p{margin:0 0 18px;font-size:15px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.dlg button{padding:8px 18px;border-radius:20px;border:1px solid #6c5ce755;
background:transparent;color:#fff;font-size:14px;cursor:pointer}
.dlg button.p{background:#cbc3f5;color:#111;border:0;font-weight:600}
.dlg.loc{min-width:340px}
.dlg.loc input{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:8px;
border:1px solid #ffffff2a;background:#1a1d22;color:#fff;font-size:14px;outline:none}
.dlg.loc input:focus{border-color:#cbc3f5}
.lres{margin:10px 0 4px;max-height:230px;overflow:auto;font-size:14px;color:#cfd4dc}
.lit{padding:8px 10px;border-radius:7px;cursor:pointer}
.lit:hover{background:#ffffff14}
</style>
<svg width="0" height="0" style="position:absolute">
<filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
 <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="4" seed="7" result="n"/>
 <feGaussianBlur in="n" stdDeviation="1.2" result="ns"/>
 <feDisplacementMap in="SourceGraphic" in2="ns" scale="55" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>
<div id=wp><div data-w=wx></div><div data-w=sol></div><div data-w=llm></div></div>
<div id=b><button id=add title=add><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><button id=ed title=edit><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M14.5 6.5l3 3"/></svg></button><button id=menu title=menu><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
<div id=mp>
 <div data-a=save>Save profile</div>
 <div data-a=saveas>Save profile as…</div>
 <div data-a=export>Export profile</div>
 <div data-a=import>Import profile</div>
 <div data-a=newprof>Create a new profile</div>
 <div data-a=setloc>Set weather location</div>
 <div data-a=clearwx>Refresh weather</div>
 <div data-a=clearic>Clear icon cache</div>
</div>
<button id=back title=back>&#8592;</button>
<div id=clk></div>
<div id=dt></div>
<div id=tl><div id=bat></div></div>
<div id=sol></div>
<form id=sb autocomplete=off>
<img id=ddg alt="">
<input id=sq placeholder="Search DuckDuckGo"></form>
<form id=cb autocomplete=off>
<img id=cim alt="">
<input id=cq placeholder="Ask Claude"></form>
<div id=wx></div>
<div id=g></div>
<script src="bglist.js"></script>
<script src="newtab.js"></script>
